name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  tests:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@1285b95e32c783cfa40eb2ffbd6ca4cd023fb884 # v3.2.2
    with:
      runs-on: |
        linux: ubuntu-22.04
      envs: |
        - linux: py310-test-numpy124
        - linux: py310-test-numpy125
        - linux: py311-test-numpy126
        - linux: py311-test-numpy20
        - linux: py312-test-numpy20
        - linux: py313-test-numpy21
        - linux: py314-test-numpydev

        - macos: py310-test-numpy124
        - macos: py310-test-numpy125
        - macos: py311-test-numpy126
        - macos: py311-test-numpy20
        - macos: py312-test-numpy20
        - macos: py313-test-numpy21
        - macos: py314-test-numpydev

        - windows: py310-test-numpy124
        - windows: py310-test-numpy125
        - windows: py311-test-numpy126
        - windows: py311-test-numpy20
        - windows: py312-test-numpy20
        - windows: py313-test-numpy21
        - windows: py314-test-numpydev

  publish:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish.yml@1285b95e32c783cfa40eb2ffbd6ca4cd023fb884 # v3.2.2
    with:
      test_extras: test
      test_command: pytest --pyargs fast_histogram -m "not hypothesis"
      sdist-runs-on: ubuntu-22.04
      targets: |
        - cp*-manylinux_x86_64
        - target: cp*-manylinux_aarch64
          runs-on: ubuntu-24.04-arm
        - cp*-musllinux_x86_64
        # - cp*-musllinux_aarch64
        - pp*-manylinux_x86_64
        # - pp*-manylinux_aarch64
        - cp*-macosx_x86_64
        - cp*-macosx_arm64
        - windows
        - cp*-pyodide_wasm32
      env: |
        CIBW_SKIP: "cp314t-*"
        EXTENSION_HELPERS_PY_LIMITED_API: "cp310"

  publish_freethreaded:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish.yml@1285b95e32c783cfa40eb2ffbd6ca4cd023fb884 # v3.2.2
    with:
      test_extras: test
      test_command: pytest --pyargs fast_histogram -m "not hypothesis"
      sdist: false
      targets: |
        - cp314t-manylinux_x86_64
        - target: cp314t-manylinux_aarch64
          runs-on: ubuntu-24.04-arm
        - cp314t-musllinux_x86_64
        - cp314t-macosx_x86_64
        - cp314t-macosx_arm64
        - cp314t-win*
      env: |
        EXTENSION_HELPERS_PY_LIMITED_API: ""
